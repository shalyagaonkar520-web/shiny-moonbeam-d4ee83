    <!-- Structured Data (Restaurant Schema) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Moms Magic",
      "image": "https://momsmagic.shop/logo.png",
      "url": "https://momsmagic.shop",
      "telephone": "+919606001790",
      "priceRange": "$$",
      "servesCuisine": ["Indian", "Chinese", "Fast Food", "Biryani"],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Yellapur",
        "addressRegion": "Karnataka",
        "addressCountry": "IN"
      },
      "areaServed": [
        {
          "@type": "AdministrativeArea",
          "name": "Yellapur"
        },
        {
          "@type": "AdministrativeArea",
          "name": "Dandeli"
        }
      ],
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "00:00",
          "closes": "23:59"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(to bottom, #fff1f4, #fff8fa, #ffffff);font-family:system-ui,-apple-system,sans-serif;color:#111827;padding:16px;text-align:center;">
        <style>
          @keyframes foodRot { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          @keyframes foodCounter { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
          @keyframes foodBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
          .food-orbit-container { position:relative; width:180px; height:180px; display:flex; align-items:center; justify-content:center; }
          .food-orbit-ring { position:absolute; inset:0; animation: foodRot 7s linear infinite; }
          .food-orbit-item { position:absolute; top:50%; left:50%; margin-top:-18px; margin-left:-18px; width:36px; height:36px; background:#ffffff; border-radius:12px; box-shadow:0 4px 12px rgba(225,29,72,0.12); border:1px solid #ffe4e6; display:flex; align-items:center; justify-content:center; font-size:18px; animation: foodCounter 7s linear infinite; }
          .center-plate { width:84px; height:84px; border-radius:50%; background:linear-gradient(135deg, #ff4d6d, #e11d48); color:#ffffff; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 10px 25px rgba(225,29,72,0.25); border:3px solid #ffffff; }
        </style>
        <div class="food-orbit-container">
          <div class="food-orbit-ring">
            <div class="food-orbit-item" style="transform: rotate(0deg) translate(75px) rotate(0deg);">🍲</div>
            <div class="food-orbit-item" style="transform: rotate(60deg) translate(75px) rotate(-60deg);">🍗</div>
            <div class="food-orbit-item" style="transform: rotate(120deg) translate(75px) rotate(-120deg);">🍕</div>
            <div class="food-orbit-item" style="transform: rotate(180deg) translate(75px) rotate(-180deg);">🥘</div>
            <div class="food-orbit-item" style="transform: rotate(240deg) translate(75px) rotate(-240deg);">🍰</div>
            <div class="food-orbit-item" style="transform: rotate(300deg) translate(75px) rotate(-300deg);">🌯</div>
          </div>
          <div class="center-plate">
            <span style="font-size:36px; animation: foodBounce 1.5s infinite;">🍲</span>
          </div>
        </div>
        <div style="margin-top:22px;">
          <h2 style="font-size:22px; font-weight:900; color:#111827; margin:0; letter-spacing:-0.5px;">Mom's Magic</h2>
          <p style="font-size:12px; font-weight:700; color:#e11d48; margin:6px 0 0 0;">Preparing delicious food... 🍳</p>
          <div style="margin-top:10px;">
            <span style="display:inline-block; background:#fff1f4; border:1px solid #fecdd3; color:#be123c; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1px; padding:4px 12px; border-radius:999px;">
              ⚡ 10-Minute Fast Delivery in Yellapur
            </span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
